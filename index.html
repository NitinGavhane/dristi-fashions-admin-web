<!doctype html>
<html lang="en">
  <head>
    <script>
      // This site was previously a Flutter web build, which registered
      // flutter_service_worker.js. That worker serves the old app from cache,
      // so a returning admin can keep seeing the Flutter panel even after this
      // build is live. This React build ships no service worker, so remove any
      // leftover registration (and its caches) once and reload.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () {
              return (window.caches && caches.keys)
                ? caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  })
                : null;
            })
            .then(function () { window.location.reload(); });
        }).catch(function () {});
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dristi Fashions Admin Panel</title>
    <meta name="description" content="Dristi Fashions — admin panel for products, orders, delivery and referrals." />
    <meta name="theme-color" content="#6b38d4" />
    <!-- An admin console has no business being indexed. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/jpeg" href="./logo.jpg" />
    <link rel="apple-touch-icon" href="./logo.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=Montserrat:wght@600..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
