<!doctype html>
<html lang="en">
  <head>
    <script>
      // This site was previously a Flutter web build, which registered
      // flutter_service_worker.js. That worker serves the old app from cache,
      // so a returning admin can keep seeing the Flutter panel even after this
      // build is live. This React build ships no service worker, so remove any
      // leftover registration (and its caches) once and reload.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () {
              return (window.caches && caches.keys)
                ? caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  })
                : null;
            })
            .then(function () { window.location.reload(); });
        }).catch(function () {});
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dristi Fashions Admin Panel</title>
    <meta name="description" content="Dristi Fashions — admin panel for products, orders, delivery and referrals." />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <!-- An admin console has no business being indexed. -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/jpeg" href="./logo.jpg" />
    <link rel="apple-touch-icon" href="./logo.jpg" />

    <!-- Clash Display carries the headings; Plus Jakarta Sans the UI; Geist Mono
         the figures that sit in columns (order numbers, SKUs, OTPs). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f%5B%5D=clash-display@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&family=Geist+Mono:wght@300..600&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve the theme before first paint. Without this a light-mode admin
         gets a black flash on every load, and a dark-mode one gets a white one. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dristi_admin_theme') || 'dark';
          var dark = saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.backgroundColor = dark ? '#08080b' : '#f7f7f9';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
